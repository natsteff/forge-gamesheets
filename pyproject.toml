[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-gamesheets"
version = "0.0.0"
description = "Self-hosted library and print-on-demand forge for tabletop game resources"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "anyio>=4.8,<5",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pillow>=11,<13",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "qrcode[pil]>=8,<9",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
