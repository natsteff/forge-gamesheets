name: forge-gamesheets

# SECURITY / DEPLOYMENT NOTE:
#
# The default bind address, 127.0.0.1, allows access only from this Docker host.
# Set FORGE_GAMESHEETS_BIND_ADDRESS=0.0.0.0 only for a trusted LAN or when an
# appropriate access-control layer protects Forge. Forge currently has no
# built-in authentication and must not be exposed directly to the Internet.
#
# The data mount is writable persistent application state. The library mount
# contains source PDFs and remains read-only inside the container.
services:
  app:
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 1g
    cpus: 2.0
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    image: ghcr.io/natsteff/forge-gamesheets:${FORGE_GAMESHEETS_IMAGE_TAG:-main}
    build:
      context: .
      target: ${FORGE_GAMESHEETS_BUILD_TARGET:-runtime}
      args:
        FORGE_GAMESHEETS_VERSION: ${FORGE_GAMESHEETS_VERSION:-development}
        FORGE_GAMESHEETS_REVISION: ${FORGE_GAMESHEETS_REVISION:-}
        FORGE_GAMESHEETS_BUILD_DATE: ${FORGE_GAMESHEETS_BUILD_DATE:-}
    environment:
      FORWARDED_ALLOW_IPS: ${FORGE_GAMESHEETS_FORWARDED_ALLOW_IPS:-127.0.0.1}
      FORGE_GAMESHEETS_ALLOWED_HOSTS: ${FORGE_GAMESHEETS_ALLOWED_HOSTS:-}
      FORGE_GAMESHEETS_BASE_URL: ${FORGE_GAMESHEETS_BASE_URL:-}
      FORGE_GAMESHEETS_BGG_API_TOKEN: ${FORGE_GAMESHEETS_BGG_API_TOKEN:-}
      FORGE_GAMESHEETS_DATA: /data
      FORGE_GAMESHEETS_LIBRARY: /library
    ports:
      - >-
        ${FORGE_GAMESHEETS_BIND_ADDRESS:-127.0.0.1}:${FORGE_GAMESHEETS_PORT:-8000}:8000
    volumes:
      - type: bind
        source: ${FORGE_GAMESHEETS_DATA_PATH:-./data}
        target: /data
      - type: bind
        source: ${FORGE_GAMESHEETS_LIBRARY_PATH:-./library}
        target: /library
        read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
