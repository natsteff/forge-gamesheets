name: forge-gamesheets

services:
  app:
    build:
      context: .
    environment:
      FORGE_GAMESHEETS_DATA: /data
      FORGE_GAMESHEETS_LIBRARY: /library
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - ./library:/library:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# Production-specific ports, paths, users, and policies are intentionally not
# defined during local Phase 1 development.
