name: Publish container image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application and security tools
        run: python -m pip install ".[dev]" "pip-audit==2.10.1"

      - name: Run tests
        run: pytest

      - name: Run lint checks
        run: ruff check .

      - name: Audit Python dependencies
        run: python -m pip_audit --local --skip-editable

      - name: Prepare build identity
        id: identity
        shell: bash
        run: |
          version=development
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "revision=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u +%F)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build image for security review
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: forge-gamesheets:security-review
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            FORGE_GAMESHEETS_VERSION=${{ steps.identity.outputs.version }}
            FORGE_GAMESHEETS_REVISION=${{ steps.identity.outputs.revision }}
            FORGE_GAMESHEETS_BUILD_DATE=${{ steps.identity.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report high and critical container vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: forge-gamesheets:security-review
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Block fixed critical container vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: forge-gamesheets:security-review
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              docker tag forge-gamesheets:security-review "${tag}"
              docker push "${tag}"
            fi
          done <<< "${IMAGE_TAGS}"
